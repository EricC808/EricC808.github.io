<section class="portfolio-hero">
  <div class="container">
    <div class="row align-items-center g-4">
      <div class="col-lg-4 text-center">
        <img src="{{ site.data.bio.basics.picture }}" class="portfolio-avatar" alt="{{ site.data.bio.basics.name }}">
      </div>

      <div class="col-lg-8">
        <p class="hero-kicker mb-2">PORTFOLIO</p>
        <h1 class="display-3 fw-bold mb-2">{{ site.data.bio.basics.name }}</h1>
        <p class="hero-role mb-3">{{ site.data.bio.basics.label }}</p>
        <p class="hero-summary mb-4">{{ site.data.bio.basics.summary }}</p>

        <div class="d-flex flex-wrap gap-2 mb-4">
          <a href="#projects" class="btn btn-dark px-4">View Projects</a>
          <a href="https://github.com/{{ site.data.bio.basics.profiles[0].username }}" target="_blank" rel="noopener" class="btn btn-outline-dark px-4">GitHub</a>
          <a href="{{ '/resume.html' | prepend: site.baseurl }}" class="btn btn-outline-secondary px-4">Resume</a>
        </div>

        <div class="hero-interests">
          <span class="hero-interests-label">Interests</span>
          {% for interest in site.data.bio.interests %}
            <span class="hero-interest">{{ interest.name }}</span>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
