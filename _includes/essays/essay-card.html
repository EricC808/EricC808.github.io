<div class="col-md-6 col-lg-4">
  <article class="card essay-card h-100">
    <div class="card-body d-flex flex-column">
      <p class="essay-date mb-2">{{ include.page.date | date_to_string }}</p>
      <h5 class="card-title fw-semibold">{{ include.page.title }}</h5>
      <p class="card-text essay-preview">{{ include.page.content | markdownify | strip_html | truncatewords: 30 }}</p>
      <div class="mt-auto">
        <p class="mb-3">
          {% for label in include.page.labels %}
            <span class="badge rounded-pill portfolio-badge">{{ label }}</span>
          {% endfor %}
        </p>
        <a href="{% if page.essayurl %}{{ page.essayurl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="stretched-link essay-read-link">Read More →</a>
      </div>
    </div>
  </article>
</div>
